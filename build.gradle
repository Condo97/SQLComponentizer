plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.condo97'
version = System.getenv('VERSION') ?: '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'

    // Exported to consumers (on their compile classpath)
    api 'org.apache.commons:commons-math3:3.6.1'

    // Internal only
    implementation 'com.google.guava:guava:31.1-jre'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        gpr(MavenPublication) {
            from components.java
            
            pom {
                name = 'SQLComponentizer'
                description = 'A Java library for building componentized SQL prepared statements'
                url = 'https://github.com/Condo97/SQLComponentizer'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'condo97'
                        name = 'Condo97'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/Condo97/SQLComponentizer.git'
                    developerConnection = 'scm:git:ssh://github.com/Condo97/SQLComponentizer.git'
                    url = 'https://github.com/Condo97/SQLComponentizer'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Condo97/SQLComponentizer")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.token") ?: ""
            }
        }
    }
}
